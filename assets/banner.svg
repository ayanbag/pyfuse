<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="pyfuse — fuzzy search over records for Python">
  <title>pyfuse — fuzzy search over records for Python</title>
  <style>
    .sans { font-family: "Segoe UI", Inter, -apple-system, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <rect width="1200" height="500" rx="12" fill="#16161b"/>

  <!-- icon tile: "approximately equal" is what fuzzy matching means -->
  <rect x="552" y="72" width="96" height="96" rx="23" fill="#ffd166"/>
  <g stroke="#16161b" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M582 105 q10 -11 20 0 t20 0"/>
    <path d="M582 135 q10 -11 20 0 t20 0"/>
  </g>

  <!-- wordmark -->
  <text class="sans" x="600" y="248" font-size="66" font-weight="700"
        fill="#f4f2ee" text-anchor="middle" letter-spacing="-1.4">pyfuse</text>

  <text class="sans" x="600" y="292" font-size="22" font-weight="600"
        fill="#ffd166" text-anchor="middle">fuzzy search over records, for Python</text>

  <text class="sans" x="600" y="330" font-size="18" fill="#8e8b96" text-anchor="middle">
    a behavioural port of fuse.js · zero dependencies
  </text>

  <line x1="300" y1="380" x2="900" y2="380" stroke="#2b2b33"/>

  <!-- verified numbers only -->
  <g class="sans" text-anchor="middle" font-size="16">
    <text x="300" y="422" fill="#7fc9a5" font-weight="700">285/297</text>
    <text x="300" y="446" fill="#77747f" font-size="13">original JS tests</text>

    <text x="500" y="422" fill="#7fc9a5" font-weight="700">0</text>
    <text x="500" y="446" fill="#77747f" font-size="13">divergences / 51,569</text>

    <text x="700" y="422" fill="#7fc9a5" font-weight="700">421</text>
    <text x="700" y="446" fill="#77747f" font-size="13">own tests</text>

    <text x="900" y="422" fill="#7fc9a5" font-weight="700">0</text>
    <text x="900" y="446" fill="#77747f" font-size="13">dependencies</text>
  </g>
</svg>
