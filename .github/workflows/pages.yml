# Publishes docs/ to GitHub Pages as a live, in-browser playground.
#
# The wheel is BUILT here rather than committed, so what the playground runs is
# always the source at this commit. There is no separate artifact to remember
# to refresh, and no binary in the repository.
name: playground

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel into docs/
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir docs/
          ls -la docs/

      - name: Point the page at the wheel it just built
        run: |
          wheel=$(basename docs/*.whl)
          echo "Built $wheel"
          sed -i "s|\./fusejs_python-[^\"]*\.whl|./$wheel|" docs/index.html
          grep -o 'micropip.install("[^"]*")' docs/index.html

      - name: Smoke-test the port before publishing it
        run: |
          python -m pip install docs/*.whl
          python - <<'PY'
          from fusejs import Fuse
          books = [{"title": "Old Man's War"}, {"title": "The Lock Artist"}]
          hits = Fuse(books, {"keys": ["title"], "include_score": True}).search("old man")
          assert hits and hits[0].item["title"] == "Old Man's War", hits
          print("wheel imports and searches correctly:", hits[0].score)
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
